name: inkwords

services:
  obsidian-bridge:
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - apk add --no-cache socat && socat -d -d TCP-LISTEN:27125,fork,reuseaddr TCP:host.docker.internal:27124
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "27125"
    networks:
      - inkwords-network
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkwords}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inkwords_password}
      POSTGRES_DB: ${POSTGRES_DB:-inkwords_db}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkwords} -d ${POSTGRES_DB:-inkwords_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"
      - "15672"
    networks:
      - inkwords-network
    restart: unless-stopped

  core-api:
    build:
      context: ./backend
      dockerfile: services/core-api/Dockerfile
    image: inkwords/core-api:local
    command: ["./core-api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/${POSTGRES_DB:-inkwords_db}?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OBSIDIAN_REST_API_BASE_URL: ${OBSIDIAN_REST_API_BASE_URL:-https://obsidian-bridge:27125}
      OBSIDIAN_REST_API_KEY: ${OBSIDIAN_REST_API_KEY:-}
      OBSIDIAN_REST_API_CERT_PATH: ${OBSIDIAN_REST_API_CERT_PATH:-}
      OBSIDIAN_REST_API_INSECURE_SKIP_VERIFY: ${OBSIDIAN_REST_API_INSECURE_SKIP_VERIFY:-}
      OBSIDIAN_WIKI_DIR: ${OBSIDIAN_WIKI_DIR:-wiki}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      TEXTBOOK_GENERATION_PROVIDER: ${TEXTBOOK_GENERATION_PROVIDER:-fake}
      TEXTBOOK_STANDARD_MODEL: ${TEXTBOOK_STANDARD_MODEL:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-inkwords.events}
      RABBITMQ_GENERATION_QUEUE: ${RABBITMQ_GENERATION_QUEUE:-inkwords.generation}
      RABBITMQ_EXPORT_QUEUE: ${RABBITMQ_EXPORT_QUEUE:-inkwords.export}
      EXPORT_ARTIFACTS_DIR: ${EXPORT_ARTIFACTS_DIR:-/app/export-artifacts}
      TEXTBOOK_SOURCE_ARTIFACTS_DIR: ${TEXTBOOK_SOURCE_ARTIFACTS_DIR:-/app/source-artifacts}
      TEXTBOOK_TEACHING_ARTIFACTS_DIR: ${TEXTBOOK_TEACHING_ARTIFACTS_DIR:-/app/teaching-artifacts}
      # Must match the operator-pinned course-runner image's actual Go version.
      TEXTBOOK_TEACHING_GO_VERSION: ${TEXTBOOK_TEACHING_GO_VERSION:-go1.26.8}
      TEXTBOOK_DEPENDENCY_CATALOG_FILE: ${TEXTBOOK_DEPENDENCY_CATALOG_FILE:-}
      TEXTBOOK_VISUAL_ASSETS_DIR: ${TEXTBOOK_VISUAL_ASSETS_DIR:-/app/visual-assets}
      TEXTBOOK_TEACHING_ARTIFACT_VERIFICATION_ENABLED: ${TEXTBOOK_TEACHING_ARTIFACT_VERIFICATION_ENABLED:-false}
    expose:
      - "8080"
    volumes:
      - uploads:/app/uploads
      - export-artifacts:/app/export-artifacts
      # Raw sources are content-addressed. parser-service receives read-only
      # access and task messages carry only their SHA-256 token.
      - source-artifacts:/app/source-artifacts
      # Generated teaching examples are a distinct immutable artifact class;
      # the verification worker receives the same volume read-only.
      - teaching-artifacts:/app/teaching-artifacts
      - visual-assets:/app/visual-assets
      # Why: require an explicit host wiki path instead of silently binding a
      # machine-specific absolute path that only works on one workstation.
      - type: bind
        source: ${OBSIDIAN_VAULT_PATH:?Set OBSIDIAN_VAULT_PATH in backend/.env (used with --env-file) or your shell environment}
        target: /app/obsidian
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      obsidian-bridge:
        condition: service_started
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  llm-stream:
    build:
      context: ./backend
      dockerfile: services/llm-stream/Dockerfile
    image: inkwords/llm-stream:local
    command: ["./llm-stream"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/${POSTGRES_DB:-inkwords_db}?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      TEXTBOOK_GENERATION_PROVIDER: ${TEXTBOOK_GENERATION_PROVIDER:-fake}
      TEXTBOOK_STANDARD_MODEL: ${TEXTBOOK_STANDARD_MODEL:-}
      TEXTBOOK_CORE_MODEL: ${TEXTBOOK_CORE_MODEL:-}
      TEXTBOOK_GENERATION_REQUEST_TIMEOUT: ${TEXTBOOK_GENERATION_REQUEST_TIMEOUT:-15m}
      TEXTBOOK_REJECTED_DRAFTS_DIR: /app/rejected-drafts/private
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      INKWORDS_TASK_PERSISTENCE_MODE: ${INKWORDS_TASK_PERSISTENCE_MODE:-task_only}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-inkwords.events}
      RABBITMQ_GENERATION_QUEUE: ${RABBITMQ_GENERATION_QUEUE:-inkwords.generation}
    volumes:
      - rejected-drafts:/app/rejected-drafts
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  parser-service:
    build:
      context: ./backend
      dockerfile: services/parser-service/Dockerfile
    image: inkwords/parser-service:local
    command: ["./parser-service"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/${POSTGRES_DB:-inkwords_db}?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-inkwords.events}
      RABBITMQ_PARSE_QUEUE: ${RABBITMQ_PARSE_QUEUE:-inkwords.parse}
      TEXTBOOK_SOURCE_ARTIFACTS_DIR: ${TEXTBOOK_SOURCE_ARTIFACTS_DIR:-/app/source-artifacts}
      TEXTBOOK_CRAWL_CHECKPOINTS_DIR: ${TEXTBOOK_CRAWL_CHECKPOINTS_DIR:-/app/crawl-checkpoints}
    expose:
      - "8080"
    volumes:
      - source-artifacts:/app/source-artifacts:ro
      - crawl-checkpoints:/app/crawl-checkpoints
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  export-service:
    build:
      context: ./backend
      dockerfile: services/export-service/Dockerfile
    image: inkwords/export-service:local
    # Frozen review ZIPs read the same immutable teaching trees as course-runner.
    # Grant the existing read group; the volume remains read-only.
    group_add:
      - "20001"
    command: ["./export-service"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/${POSTGRES_DB:-inkwords_db}?sslmode=disable
      OBSIDIAN_REST_API_BASE_URL: ${OBSIDIAN_REST_API_BASE_URL:-https://obsidian-bridge:27125}
      OBSIDIAN_REST_API_KEY: ${OBSIDIAN_REST_API_KEY:-}
      OBSIDIAN_REST_API_CERT_PATH: ${OBSIDIAN_REST_API_CERT_PATH:-}
      OBSIDIAN_REST_API_INSECURE_SKIP_VERIFY: ${OBSIDIAN_REST_API_INSECURE_SKIP_VERIFY:-}
      OBSIDIAN_WIKI_DIR: ${OBSIDIAN_WIKI_DIR:-wiki}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-inkwords.events}
      RABBITMQ_EXPORT_QUEUE: ${RABBITMQ_EXPORT_QUEUE:-inkwords.export}
      EXPORT_ARTIFACTS_DIR: ${EXPORT_ARTIFACTS_DIR:-/app/export-artifacts}
      TEXTBOOK_TEACHING_ARTIFACTS_DIR: ${TEXTBOOK_TEACHING_ARTIFACTS_DIR:-/app/teaching-artifacts}
      TEXTBOOK_VISUAL_ASSETS_DIR: ${TEXTBOOK_VISUAL_ASSETS_DIR:-/app/visual-assets}
      # DOCX uses the reviewed reference shipped with export-service. PDF stays
      # opt-in until Chromium sandboxing is verified in the deployment runtime.
      TEXTBOOK_PANDOC_BIN: ${TEXTBOOK_PANDOC_BIN:-/usr/bin/pandoc}
      TEXTBOOK_REFERENCE_DOCX: ${TEXTBOOK_REFERENCE_DOCX:-/app/assets/publishing/inkwords-reference.docx}
      TEXTBOOK_CHROMIUM_BIN: ${TEXTBOOK_CHROMIUM_BIN:-}
    expose:
      - "8080"
    volumes:
      - export-artifacts:/app/export-artifacts
      - teaching-artifacts:/app/teaching-artifacts:ro
      - visual-assets:/app/visual-assets:ro
      - type: bind
        source: ${OBSIDIAN_VAULT_PATH:?Set OBSIDIAN_VAULT_PATH in backend/.env (used with --env-file) or your shell environment}
        target: /app/obsidian
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      obsidian-bridge:
        condition: service_started
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  course-runner:
    build:
      context: ./backend
      dockerfile: services/course-runner/Dockerfile
    image: inkwords/course-runner:local
    # Only generated teaching trees are published with this read group.
    # The mount stays read-only and the runner keeps its non-root identity.
    group_add:
      - "20001"
    command: ["./course-runner"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/inkwords_db?sslmode=disable
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-inkwords.events}
      TEXTBOOK_TEACHING_ARTIFACT_VERIFICATION_ENABLED: ${TEXTBOOK_TEACHING_ARTIFACT_VERIFICATION_ENABLED:-false}
      LEARNER_ARTIFACT_VERIFICATION_ENABLED: ${LEARNER_ARTIFACT_VERIFICATION_ENABLED:-false}
      TEXTBOOK_TEACHING_ARTIFACTS_DIR: /app/teaching-artifacts
      TEXTBOOK_VISUAL_ASSETS_DIR: /app/visual-assets
      TEXTBOOK_RUNNER_IMAGE_DIGEST: ${TEXTBOOK_RUNNER_IMAGE_DIGEST:-}
      TEXTBOOK_RUNNER_SANDBOX_PROFILE_PATH: /app/seccomp/bubblewrap-outer.json
      REVIEW_SERVICE_URL: ${REVIEW_SERVICE_URL:-http://review-service:8080}
    expose:
      - "8080"
    volumes:
      - teaching-artifacts:/app/teaching-artifacts:ro
      - ./backend/services/course-runner/seccomp/bubblewrap-outer.json:/app/seccomp/bubblewrap-outer.json:ro
      # Browser screenshots are generated only after a successful isolated
      # probe and stored content-addressed for core-api/export-service to read.
      - visual-assets:/app/visual-assets
    # The service only reads immutable artifacts and writes each isolated lab
    # under /tmp. The lab itself receives a separate network namespace from
    # bubblewrap; this service network remains limited to DB and RabbitMQ.
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Derived from Moby's default profile. It permits only Bubblewrap's
      # namespace setup syscalls; course-runner installs a child seccomp filter
      # before any generated or learner-owned process starts.
      - seccomp=./backend/services/course-runner/seccomp/bubblewrap-outer.json
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  review-service:
    build:
      context: ./backend
      dockerfile: services/review-service/Dockerfile
    image: inkwords/review-service:local
    command: ["./review-service"]
    environment:
      CORE_API_URL: ${CORE_API_URL:-http://core-api:8080}
      COURSE_RUNNER_URL: ${COURSE_RUNNER_URL:-http://course-runner:8080}
      MASTERY_DEEPSEEK_API_KEY: ${MASTERY_DEEPSEEK_API_KEY:-${DEEPSEEK_API_KEY:-}}
      MASTERY_DEEPSEEK_MODEL: ${MASTERY_DEEPSEEK_MODEL:-${DEEPSEEK_MODEL:-}}
      MASTERY_ASSESSMENT_PROFILE: ${MASTERY_ASSESSMENT_PROFILE:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/${POSTGRES_DB:-inkwords_db}?sslmode=disable
      REVIEW_DATABASE_URL: postgres://${POSTGRES_USER:-inkwords}:${POSTGRES_PASSWORD:-inkwords_password}@db:5432/inkwords_review_db?sslmode=disable
      OBSIDIAN_REST_API_BASE_URL: ${OBSIDIAN_REST_API_BASE_URL:-https://obsidian-bridge:27125}
      OBSIDIAN_REST_API_KEY: ${OBSIDIAN_REST_API_KEY:-}
      OBSIDIAN_REST_API_CERT_PATH: ${OBSIDIAN_REST_API_CERT_PATH:-}
      OBSIDIAN_REST_API_INSECURE_SKIP_VERIFY: ${OBSIDIAN_REST_API_INSECURE_SKIP_VERIFY:-}
      OBSIDIAN_WIKI_DIR: ${OBSIDIAN_WIKI_DIR:-wiki}
      # Review cards are read-only projections of the already mounted local
      # vault, so they remain available even when the Obsidian REST plugin is off.
      OBSIDIAN_LOCAL_VAULT_ROOT: /app/obsidian
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${OBSIDIAN_VAULT_PATH:?Set OBSIDIAN_VAULT_PATH in backend/.env (used with --env-file) or your shell environment}
        target: /app/obsidian
    depends_on:
      db:
        condition: service_healthy
      obsidian-bridge:
        condition: service_started
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis/redis-stack-server:7.2.0-v9
    expose:
      - "6379"
    environment:
      - REDIS_ARGS=--maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - inkwords-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      core-api:
        condition: service_healthy
      llm-stream:
        condition: service_healthy
      parser-service:
        condition: service_healthy
      export-service:
        condition: service_healthy
      review-service:
        condition: service_healthy
    networks:
      - inkwords-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  inkwords-network:
    driver: bridge

volumes:
  pgdata:
  uploads:
  redisdata:
  export-artifacts:
  source-artifacts:
  teaching-artifacts:
  visual-assets:
  crawl-checkpoints:
  rejected-drafts:
