name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      - name: backend coverage thresholds
        working-directory: backend
        run: ./scripts/check_coverage.sh

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: deterministic backend integration contracts
        working-directory: backend
        run: go test -tags=integration ./integration

  frontend-test-build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run lint
        working-directory: frontend
        run: npm run lint

      - name: npm run deadcode
        working-directory: frontend
        run: npm run deadcode

      - name: npm test
        working-directory: frontend
        run: npm test

      - name: frontend coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: frontend bundle budget
        working-directory: frontend
        run: npm run check:bundle

  docker-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ensure docker compose
        run: |
          docker --version
          if docker compose version; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          docker compose version

      - name: docker compose config
        run: |
          mkdir -p /tmp/obsidian-vault /tmp/e2e-vault
          OBSIDIAN_VAULT_PATH=/tmp/obsidian-vault docker compose config
          JWT_SECRET="$(openssl rand -hex 32)" E2E_VAULT_PATH=/tmp/e2e-vault OBSIDIAN_VAULT_PATH=/tmp/obsidian-vault \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml config

  microservices-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: inkwords-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_RUN_ID: smoke-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PORT: "18080"
      E2E_VAULT_PATH: /tmp/inkwords-smoke-vault
      OBSIDIAN_VAULT_PATH: /tmp/inkwords-smoke-vault
      DEEPSEEK_API_KEY: ci-placeholder-key
      JWT_SECRET: ci-placeholder-jwt-secret
      OBSIDIAN_REST_API_KEY: ci-placeholder-obsidian-key
    steps:
      - uses: actions/checkout@v4

      - name: ensure docker compose
        run: |
          docker --version
          if docker compose version; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y docker-compose-plugin
          docker compose version

      - name: prepare smoke env
        run: |
          mkdir -p "$E2E_VAULT_PATH/wiki/e2e/$E2E_RUN_ID"

      - name: docker compose up
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build

      - name: wait for healthy services
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${E2E_PORT}/" >/dev/null && \
               curl --fail --silent "http://127.0.0.1:${E2E_PORT}/api/v1/ping" >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          echo "Services did not become healthy in time"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          exit 1

      - name: gateway smoke checks
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps
          curl -I --fail "http://127.0.0.1:${E2E_PORT}"
          curl --fail --silent "http://127.0.0.1:${E2E_PORT}/api/v1/ping"

      - name: parser worker smoke marker
        run: |
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color parser-service > /tmp/parser-service.log
          if grep -q "parse consumer disabled" /tmp/parser-service.log; then
            echo "parser worker is disabled"
            cat /tmp/parser-service.log
            exit 1
          fi

      - name: dump compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color

      - name: docker compose down
        if: always()
        run: |
          status=0
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans || status=$?
          rm -rf "$E2E_VAULT_PATH"
          exit "$status"
