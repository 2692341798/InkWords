server {
    listen 80;
    server_name localhost;

    # Compose may recreate an individual upstream while this gateway stays up.
    # Resolve service names through Docker DNS at request time so a stale
    # container IP cannot turn an otherwise healthy API into a 404 response.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;
    set $core_api_upstream core-api:8080;
    set $llm_stream_upstream llm-stream:8080;
    set $parser_service_upstream parser-service:8080;
    set $review_service_upstream review-service:8080;
    set $export_service_upstream export-service:8080;

    # 允许上传大文件
    client_max_body_size 888M;

    # 静态文件服务
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # 禁用缓存以确保更新即时生效
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Task execution is asynchronous, but task state and SSE replay belong to
    # core-api. Keep this route before the generic /api fallback so Nginx does
    # not buffer progress events.
    location ~ ^/api/v1/tasks/[^/]+/stream$ {
        proxy_pass http://$core_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/stream/ {
        proxy_pass http://$llm_stream_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 针对 SSE (Server-Sent Events) 的特殊配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/blogs/[^/]+/(continue|polish)$ {
        proxy_pass http://$llm_stream_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering "no";
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/project/parse {
        proxy_pass http://$parser_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # A crawl first produces an auditable, bounded manifest in parser-service;
    # it never writes textbook facts through this gateway route.
    location = /api/v1/project/crawl {
        proxy_pass http://$parser_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Local textbook sources may be up to 888 MiB. Stream multipart bytes to
    # core-api's content-addressed store rather than buffering a Base64 body in
    # Nginx, the browser, or RabbitMQ.
    location ~ ^/api/v1/textbook-projects/[^/]+/source-imports$ {
        proxy_pass http://$core_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/review/ {
        proxy_pass http://$review_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/mastery/ {
        proxy_pass http://$review_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/blogs/[^/]+/export {
        proxy_pass http://$export_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Approved textbook chapter exports are owned by export-service. This sits
    # before the core fallback and uses the local-workspace middleware there.
    location ~ ^/api/v1/textbook-projects/chapters/[^/]+/export/(markdown|zip)$ {
        proxy_pass http://$export_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frozen whole-book projections must stay with export-service so every
    # format is rendered from the Build's embedded canonical AST.
    location ~ ^/api/v1/textbook-projects/book-builds/[^/]+/export/(markdown|docx|pdf|review-bundle)$ {
        proxy_pass http://$export_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 代理
    location /api/ {
        proxy_pass http://$core_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 头像与上传文件代理
    location /uploads/ {
        proxy_pass http://$core_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
